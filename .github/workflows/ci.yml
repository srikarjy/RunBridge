name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: runbridge_test
          POSTGRES_DB: runbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d runbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Run PostgreSQL integration tests
        env:
          RUNBRIDGE_TEST_DATABASE_URL: postgres://postgres:runbridge_test@127.0.0.1:5432/runbridge_test?sslmode=disable
        run: go test -race -count=1 ./tests/integration
      - name: Run vet
        run: go vet ./...
      - uses: hashicorp/setup-terraform@v3
      - name: Verify Terraform formatting
        run: terraform fmt -check -recursive deployments/terraform
      - name: Initialize Terraform without backend
        working-directory: deployments/terraform
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        working-directory: deployments/terraform
        run: terraform validate

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
